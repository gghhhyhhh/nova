<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOVA - {{ topic.title }}</title>

    <link
        rel="stylesheet"
        href="/static/css/reseaux.css"
    >
</head>

<body>

    <main class="topic-page">

        <!-- RETOUR -->
        <header class="topic-topbar">

            <a href="/reseaux" class="topic-back">
                ←
            </a>

            <div class="topic-heading">

                <h1>
                    {{ topic.title }}
                </h1>

                {% if topic.created_at %}

                    <span>
                        {{ topic.created_at }}
                    </span>

                {% endif %}

            </div>

        </header>


        <!-- FIL DU SUJET -->
        <section class="topic-feed">

            {% for post in posts %}

                <article class="topic-post">

                    <div class="post-avatar">
                        
                    </div>

                    <div class="post-body">

                        <div class="post-meta">

                            <strong>
                                {{ post.username }}
                            </strong>

                            <span>·</span>

                            {% if post.created_at %}

                                <time>
                                    {{ post.created_at }}
                                </time>

                            {% endif %}

                        </div>

                        <p class="post-content">
                            {{ post.content }}
                        </p>


                        <div class="post-actions">

                            <span class="post-action">
                                💬
                            </span>

                            <form
                                action="/reseaux/post/{{ post.id }}/like"
                                method="post"
                            >

                                <button
                                    type="submit"
                                    class="like-button"
                                >
                                    ♡
                                    <span>
                                        {{ post.likes }}
                                    </span>
                                </button>

                            </form>

                        </div>

                    </div>

                </article>

            {% endfor %}


            <!-- RÉPONSE -->
            <article class="topic-post reply-post">

                <div class="post-avatar">
                    +
                </div>

                <div class="post-body">

                    <div class="post-meta">

                        <strong>
                            Votre réponse
                        </strong>

                    </div>

                    <form
                        action="/reseaux/{{ topic.id }}/comment"
                        method="post"
                        class="reply-form"
                    >

                        <textarea
                            name="content"
                            placeholder="Écrire une réponse..."
                            required
                        ></textarea>

                        <div class="reply-footer">

                            <button type="submit">
                                Publier
                            </button>

                        </div>

                    </form>

                </div>

            </article>

        </section>

    </main>

</body>

</html>
