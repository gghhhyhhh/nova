<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA — Mot de passe oublié</title>

    <link rel="stylesheet" href="/static/css/auth.css">
</head>

<body>

<main class="auth-page">

    <section class="auth-card">

        <div class="auth-logo">
            <h1>NOVA</h1>
            <p>Récupération du compte</p>
        </div>

        <h2>Mot de passe oublié</h2>

        <p class="auth-description">
            Entrez votre adresse email pour recevoir un lien
            permettant de réinitialiser votre mot de passe.
        </p>

        {% if message %}
            <div class="auth-message success">
                {{ message }}
            </div>
        {% endif %}

        <form class="auth-form" method="post" action="/forgot-password">

            <div class="auth-field">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="votre@email.com"
                    autocomplete="email"
                    required
                >

            </div>

            <button class="auth-button" type="submit">
                Envoyer le lien
            </button>

        </form>

        <div class="auth-links">

            <a href="/login">
                Retour à la connexion
            </a>

        </div>

    </section>

</main>

<script src="/static/js/auth.js"></script>

</body>
</html>
